[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
ignore = ["B008"]  # Depends() en valeur par défaut = idiome FastAPI

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
